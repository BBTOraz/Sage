name: Export ENU handbook

on:
  push:
    branches:
      - agentic-systems-handbook
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agentic-systems-handbook

      - name: Generate temporary Base64 transport
        run: |
          python - <<'PY'
          import base64
          import textwrap
          from pathlib import Path

          source = Path('tmp/enu-agent-handbook.html').read_bytes()
          encoded = base64.b64encode(source).decode('ascii')
          chunks = textwrap.wrap(encoded, 30000)
          Path('tmp/enu-agent-handbook.b64').write_text(
              '\n'.join(chunks) + '\n',
              encoding='ascii',
          )
          print('Base64 chunks:', len(chunks))
          PY

      - name: Commit temporary transport when changed
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain -- tmp/enu-agent-handbook.b64)" ]; then
            echo 'Transport file already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/enu-agent-handbook.b64
          git commit -m 'Generate temporary handbook transport'
          git push origin HEAD:agentic-systems-handbook

      - name: Validate HTML structure and embedded Python
        run: |
          python - <<'PY'
          import ast
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          path = Path('tmp/enu-agent-handbook.html')
          text = path.read_text(encoding='utf-8')
          required = [
              '<!doctype html>',
              'У студентов нет доступа к Bilge.',
              'Все задания выполняются в отдельном учебном проекте.',
              'Практика 02',
              'search_documents_tool',
              'data-tool-demo="known"',
              'downloadProject()',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing required content: {missing}')

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.anchors = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'a' and attrs.get('href', '').startswith('#'):
                      self.anchors.append(attrs['href'][1:])

          checker = Checker()
          checker.feed(text)
          duplicates = sorted({value for value in checker.ids if checker.ids.count(value) > 1})
          if duplicates:
              raise SystemExit(f'Duplicate HTML ids: {duplicates}')
          known = set(checker.ids)
          broken = sorted({anchor for anchor in checker.anchors if anchor and anchor not in known})
          if broken:
              raise SystemExit(f'Broken internal anchors: {broken}')

          match = re.search(r'const PY_SOURCE=String\.raw`([\s\S]*?)`;\nfunction downloadProject', text)
          if not match:
              raise SystemExit('Embedded Python source was not found')
          ast.parse(match.group(1))

          if text.count('<html') != 1 or text.count('</html>') != 1:
              raise SystemExit('Expected exactly one HTML document')
          print(f'Validated {path}: {len(text)} characters, {len(checker.ids)} ids')
          PY

      - name: Validate JavaScript syntax
        run: |
          node - <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('tmp/enu-agent-handbook.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
          if (scripts.length !== 1) throw new Error(`Expected one inline script, got ${scripts.length}`);
          new Function(scripts[0]);
          console.log('JavaScript syntax is valid');
          JS

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp tmp/enu-agent-handbook.html 'artifact/Проектирование агентных систем — справочник ENU.html'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enu-agent-systems-handbook
          path: artifact/
          if-no-files-found: error
          retention-days: 1
